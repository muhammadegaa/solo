<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thread</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Young+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the whole app is one ongoing conversation. Every screen is a moment in the thread; plans, nudges and the weekly view arrive as messages with tap replies. */
:root {
  --bg: #f3f4ef;
  --surface: #fbfbf8;
  --text: #1f2620;
  --muted: #646d65;
  --line: #dde1d6;
  --them: #e6eadf;
  --me: #3d5a40;
  --me-ink: #f4f7f1;
  --accent: #3d5a40;
  --warm: #b8743a;
  --display: "Young Serif", Georgia, serif;
  --body: "Atkinson Hyperlegible", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121612; --surface: #181d18; --text: #e5eadf; --muted: #9aa597; --line: #2a322a;
    --them: #232a23; --me: #8fb48f; --me-ink: #0f140f; --accent: #8fb48f; --warm: #d9975c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121612; --surface: #181d18; --text: #e5eadf; --muted: #9aa597; --line: #2a322a;
  --them: #232a23; --me: #8fb48f; --me-ink: #0f140f; --accent: #8fb48f; --warm: #d9975c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); padding: 32px 16px 48px; }
header { max-width: 1200px; margin: 0 auto 28px; display: grid; gap: 6px; }
header h1 { font: 400 38px/1.05 var(--display); margin: 0; }
header p { margin: 0; max-width: 62ch; color: var(--muted); line-height: 1.5; }
.board { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }
figure { margin: 0; display: grid; gap: 10px; justify-items: center; }
figcaption { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.phone { width: 300px; max-width: 100%; height: 620px; border-radius: 40px; background: #0d100d; padding: 12px; }
.screen { height: 100%; border-radius: 30px; background: var(--surface); overflow: hidden; display: flex; flex-direction: column; position: relative; }
.top { display: grid; justify-items: center; gap: 2px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.top b { font: 400 17px var(--display); }
.top span { font: 11px var(--mono); color: var(--muted); }
.thread { flex: 1; padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.stamp { align-self: center; font: 11px var(--mono); color: var(--muted); }
.msg { max-width: 86%; padding: 10px 13px; border-radius: 18px; font-size: 15px; line-height: 1.4; }
.them { background: var(--them); align-self: flex-start; border-bottom-left-radius: 6px; }
.me { background: var(--me); color: var(--me-ink); align-self: flex-end; border-bottom-right-radius: 6px; }
.msg ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.replies { display: flex; flex-wrap: wrap; gap: 6px; }
.reply { font: 700 13px var(--body); padding: 8px 12px; border-radius: 999px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); }
.reply:focus-visible, .compose input:focus-visible, .scale button:focus-visible { outline: 3px solid var(--warm); outline-offset: 2px; }
.compose { display: flex; gap: 8px; padding: 10px 12px 14px; border-top: 1px solid var(--line); }
.compose input { flex: 1; font: 15px var(--body); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; background: var(--bg); color: var(--text); }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 8px; }
.scale button { font: 700 16px var(--body); height: 38px; border-radius: 10px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); }
.scale button.on { background: var(--accent); color: var(--me-ink); }
.card { align-self: stretch; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 8px; }
.card h3 { margin: 0; font: 400 16px var(--display); }
.card p { margin: 0; font-size: 14px; line-height: 1.4; }
svg text { fill: var(--muted); font: 10px var(--mono); }
.svg-line { stroke: var(--accent); }
.svg-grid { stroke: var(--line); }
.svg-dot { fill: var(--accent); }
table { border-collapse: collapse; font: 11.5px var(--mono); width: 100%; font-variant-numeric: tabular-nums; }
th { font-weight: 500; color: var(--muted); }
th, td { text-align: right; padding: 5px 3px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-top-left-radius: 22px; border-top-right-radius: 22px; box-shadow: 0 -10px 30px rgba(0,0,0,.18); padding: 10px 18px 20px; display: grid; gap: 0; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); justify-self: center; margin-bottom: 8px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.row span:last-child { font: 13px var(--mono); color: var(--muted); }
.danger { color: #b5473a; font-weight: 700; }
.dim { opacity: .35; }
.source { font: 10.5px var(--mono); color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>3 · Thread</h1>
  <p>The app is a single conversation, like texting a calm friend. The morning plan, nudges and the weekly view all arrive as messages, and you answer by tapping. This design puts the two-way check-in first.</p>
</header>
<main class="board">

<figure>
  <div class="phone"><div class="screen">
    <div class="top"><b>Check-in</b><span>Tue 6 Oct</span></div>
    <div class="thread">
      <span class="stamp">07:30</span>
      <div class="msg them">Morning. You slept about an hour less than usual and woke a couple of times.</div>
      <div class="msg them">So let's keep today light:
        <ul><li>10-min walk outside, late morning</li><li>3 min slow breathing after lunch</li></ul>
      </div>
      <div class="replies" role="group" aria-label="Reply">
        <button class="reply" id="d3-ok">Sounds good</button>
        <button class="reply" id="d3-bad">Slept badly</button>
        <button class="reply" id="d3-busy">Busy today</button>
        <button class="reply" id="d3-low">Feeling low</button>
      </div>
      <div class="msg me">Got a call with a recruiter at 11</div>
      <div class="msg them">Then walk at 10:30, before the call. It's a good way to settle first.</div>
    </div>
    <div class="compose"><input id="d3-text" placeholder="Message" aria-label="Message"></div>
  </div></div>
  <figcaption>Today</figcaption>
</figure>

<figure>
  <div class="phone"><div class="screen">
    <div class="top"><b>Check-in</b><span>Tue 6 Oct</span></div>
    <div class="thread">
      <div class="msg them dim">Then walk at 10:30, before the call.</div>
      <span class="stamp">15:00</span>
      <div class="msg them">How did the walk go?</div>
      <div class="replies" role="group" aria-label="Walk">
        <button class="reply" id="n3-done">Done</button>
        <button class="reply" id="n3-later">Later</button>
        <button class="reply" id="n3-skip">Skip</button>
      </div>
      <div class="msg them">And how stressed are you right now?
        <div class="scale" role="group" aria-label="Stress 1 calm to 5 very stressed">
          <button id="n3-s1">1</button><button id="n3-s2">2</button><button class="on" id="n3-s3">3</button><button id="n3-s4">4</button><button id="n3-s5">5</button>
        </div>
      </div>
      <div class="msg me">Done · 3</div>
      <div class="msg them">Thanks. Breathing break whenever suits.</div>
    </div>
    <div class="compose"><input id="n3-text" placeholder="Message" aria-label="Message"></div>
  </div></div>
  <figcaption>Nudge</figcaption>
</figure>

<figure>
  <div class="phone"><div class="screen">
    <div class="top"><b>Check-in</b><span>Sun 11 Oct</span></div>
    <div class="thread">
      <span class="stamp">Sunday 18:00</span>
      <div class="msg them">Here's your week.</div>
      <div class="card">
        <h3>Stress, Mon to Sun</h3>
        <svg viewBox="0 0 250 120" role="img" aria-label="Average stress per day: 4, 4, 3, 3, 2, 3, 2">
          <text x="2" y="22">5</text><text x="2" y="98">1</text>
          <line class="svg-grid" x1="14" y1="18" x2="246" y2="18"/><line class="svg-grid" x1="14" y1="94" x2="246" y2="94"/>
          <polyline class="svg-line" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="22,37 59,37 96,56 133,56 170,75 207,56 244,75"/>
          <circle class="svg-dot" cx="244" cy="75" r="4.5"/>
          <text x="18" y="114">M</text><text x="55" y="114">T</text><text x="92" y="114">W</text><text x="129" y="114">T</text><text x="167" y="114">F</text><text x="203" y="114">S</text><text x="240" y="114">S</text>
        </svg>
        <p>Down from 4 to 2. Outside on 5 of 7 days, two of them with the kids.</p>
      </div>
      <div class="msg them">Bedtime moved between 23:05 and 00:40. Want to aim for before midnight this week?</div>
      <div class="replies"><button class="reply" id="w3-yes">Yes</button><button class="reply" id="w3-no">Not now</button></div>
    </div>
  </div></div>
  <figcaption>Week</figcaption>
</figure>

<figure>
  <div class="phone"><div class="screen">
    <div class="top"><b>Details</b><span>Last 14 days</span></div>
    <div class="thread">
      <div class="card">
        <h3>Your usual</h3>
        <p>7.2 h sleep · bed 23:40 · HRV 46 ms</p>
      </div>
      <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Day</th><th>Sleep</th><th>Bed</th><th>HRV</th><th>Steps</th><th>Stress</th></tr></thead>
        <tbody>
          <tr><td>6 Oct</td><td>6.1</td><td>00:40</td><td>41</td><td>—</td><td>3</td></tr>
          <tr><td>5 Oct</td><td>7.4</td><td>23:15</td><td>47</td><td>6,880</td><td>2</td></tr>
          <tr><td>4 Oct</td><td>7.0</td><td>23:50</td><td>45</td><td>3,120</td><td>3</td></tr>
          <tr><td>3 Oct</td><td>6.6</td><td>00:10</td><td>43</td><td>8,410</td><td>2</td></tr>
          <tr><td>2 Oct</td><td>7.6</td><td>23:05</td><td>49</td><td>5,240</td><td>3</td></tr>
        </tbody>
      </table>
      </div>
      <span class="source">Data from Polar. Example values.</span>
    </div>
  </div></div>
  <figcaption>Details</figcaption>
</figure>

<figure>
  <div class="phone"><div class="screen">
    <div class="top"><b>Check-in</b><span>Tue 6 Oct</span></div>
    <div class="thread dim" aria-hidden="true">
      <div class="msg them">Morning. You slept about an hour less than usual.</div>
      <div class="msg me">Got a call with a recruiter at 11</div>
    </div>
    <div class="sheet">
      <div class="grab" aria-hidden="true"></div>
      <div class="row"><span>Morning message</span><span>07:30</span></div>
      <div class="row"><span>Check-ins</span><span>11:00, 15:00</span></div>
      <div class="row"><span>Busy today</span><span>Off</span></div>
      <div class="row"><span>Polar Loop</span><span>Connected</span></div>
      <div class="row"><span>No-wearable mode</span><span>Off</span></div>
      <div class="row"><span class="danger">Delete all my data</span><span></span></div>
    </div>
  </div></div>
  <figcaption>Settings</figcaption>
</figure>

</main>
</body>
</html>
